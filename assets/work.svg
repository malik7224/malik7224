<svg xmlns="http://www.w3.org/2000/svg" width="640" height="706" viewBox="0 0 640 706" role="img" aria-label="Selected work: Helpdesk (open source), Settle, Bill Khata, Marketplace, Firebase Admin API. Client work stays private.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#26262A" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F4F4F2; }
    .m   { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
    .dim { fill: #A1A1A6; }
    .acc { fill: #F2B84B; }
    .in  { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<rect x="0.5" y="0.5" width="639" height="705" rx="18" fill="#1E1E21" stroke="#333338"/>
