<g class=""><rect x="218" y="246" width="98" height="30" rx="8" fill="#1E1E21"/><text class="m" x="267.0" y="265.2" font-size="12" font-weight="500" text-anchor="middle" fill="#F4F4F2">TypeScript</text></g>
</g>
