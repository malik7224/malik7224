<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="648" viewBox="0 0 1280 648" role="img" aria-label="Selected work: Settle, Bill Khata, Marketplace, Firebase Admin API. Private projects, code on request.">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
