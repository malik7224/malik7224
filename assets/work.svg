<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="552" viewBox="0 0 1280 552" role="img" aria-label="Selected work: Settle, Marketplace, Firebase Admin API, Field Operations Suite.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#26262B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A853"/><stop offset="1" stop-color="#F1D79A"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 700; fill: #D4A853; letter-spacing: 5px; }
    .h1   { font-size: 44px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.8px; }
    .p    { font-size: 24px; fill: #A1A1AA; }
    .note { font-size: 19px; fill: #8A8A93; }
    .ct   { font-size: 28px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.3px; }
    .cs   { font-size: 18px; fill: #D4A853; font-weight: 600; letter-spacing: .3px; }
    .li   { font-size: 20px; fill: #C4C4CB; }
    .chip { font-size: 19px; font-weight: 600; fill: #F4F4F5; }
    .lab  { font-size: 14px; font-weight: 700; fill: #D4A853; letter-spacing: 3px; }
    .in   { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <clipPath id="clip"><rect width="1280" height="552" rx="12"/></clipPath>
  <g clip-path="url(#clip)">
    <rect width="1280" height="552" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="1279" height="551" rx="12" fill="none" stroke="#3F3F46"/>
    <text class="eyebrow in" x="80" y="78" style="animation-delay:0.1s">SELECTED WORK</text>
    <g class="in" style="animation-delay:0.3s"><rect x="80" y="112" width="540" height="170" rx="10" fill="#202024" stroke="#3F3F46"/><rect x="80" y="140" width="3" height="52" rx="1.5" fill="url(#gold)"/></g>
    <text class="ct in" x="108" y="162" style="animation-delay:0.3s">Settle</text>
    <text class="li in" x="108" y="200" style="animation-delay:0.3s">Offline IOU tracker with multi-currency</text>
    <text class="li in" x="108" y="226" style="animation-delay:0.3s">support and a documented threat model.</text>
    <text class="cs in" x="108" y="260" style="animation-delay:0.3s">Kotlin · Jetpack Compose</text>
    <g class="in" style="animation-delay:0.55s"><rect x="660" y="112" width="540" height="170" rx="10" fill="#202024" stroke="#3F3F46"/><rect x="660" y="140" width="3" height="52" rx="1.5" fill="url(#gold)"/></g>
    <text class="ct in" x="688" y="162" style="animation-delay:0.55s">Marketplace</text>
    <text class="li in" x="688" y="200" style="animation-delay:0.55s">Multi-language storefront front end</text>
    <text class="li in" x="688" y="226" style="animation-delay:0.55s">built from a full design inventory.</text>
    <text class="cs in" x="688" y="260" style="animation-delay:0.55s">Next.js · TypeScript · next-intl</text>
    <g class="in" style="animation-delay:0.8s"><rect x="80" y="312" width="540" height="170" rx="10" fill="#202024" stroke="#3F3F46"/><rect x="80" y="340" width="3" height="52" rx="1.5" fill="url(#gold)"/></g>
    <text class="ct in" x="108" y="362" style="animation-delay:0.8s">Firebase Admin API</text>
    <text class="li in" x="108" y="400" style="animation-delay:0.8s">Service for user management and</text>
    <text class="li in" x="108" y="426" style="animation-delay:0.8s">secure admin operations.</text>
    <text class="cs in" x="108" y="460" style="animation-delay:0.8s">Node.js · TypeScript · Firebase</text>
    <g class="in" style="animation-delay:1.05s"><rect x="660" y="312" width="540" height="170" rx="10" fill="#202024" stroke="#3F3F46"/><rect x="660" y="340" width="3" height="52" rx="1.5" fill="url(#gold)"/></g>
    <text class="ct in" x="688" y="362" style="animation-delay:1.05s">Field Operations Suite</text>
    <text class="li in" x="688" y="400" style="animation-delay:1.05s">Web dashboard and Android app with</text>
    <text class="li in" x="688" y="426" style="animation-delay:1.05s">voice input and live maps.</text>
    <text class="cs in" x="688" y="460" style="animation-delay:1.05s">React · Kotlin · Google Maps</text>
    <text class="note in" x="80" y="526" style="animation-delay:1.4s">Most of my work is for clients and stays private. Code walkthroughs available on request.</text>
  </g>
</svg>
