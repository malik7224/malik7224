<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="About: one engineer for the whole product. Fewer handoffs, one owner, faster delivery.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#26262B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A853"/><stop offset="1" stop-color="#F1D79A"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 700; fill: #D4A853; letter-spacing: 5px; }
    .h1   { font-size: 44px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.8px; }
    .p    { font-size: 24px; fill: #A1A1AA; }
    .note { font-size: 19px; fill: #8A8A93; }
    .ct   { font-size: 28px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.3px; }
    .cs   { font-size: 18px; fill: #D4A853; font-weight: 600; letter-spacing: .3px; }
    .li   { font-size: 20px; fill: #C4C4CB; }
    .chip { font-size: 19px; font-weight: 600; fill: #F4F4F5; }
    .lab  { font-size: 14px; font-weight: 700; fill: #D4A853; letter-spacing: 3px; }
    .in   { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <clipPath id="clip"><rect width="1280" height="330" rx="12"/></clipPath>
  <g clip-path="url(#clip)">
    <rect width="1280" height="330" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="1279" height="329" rx="12" fill="none" stroke="#3F3F46"/>
    <text class="eyebrow in" x="80" y="78" style="animation-delay:0.1s">ABOUT</text>
    <text class="h1 in" x="80" y="138" style="animation-delay:0.3s">One engineer for the whole product</text>
    <text class="p in" x="80" y="188" style="animation-delay:0.5s">I take an idea from first screen to production: the web app, the API behind it,</text>
    <text class="p in" x="80" y="224" style="animation-delay:0.6s">and the mobile app in your customers' hands.</text>
    <g class="in" style="animation-delay:0.9s"><rect x="80" y="256" width="192" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="176.0" y="285.0" text-anchor="middle">Fewer handoffs</text></g>
    <g class="in" style="animation-delay:1.15s"><rect x="288" y="256" width="136" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="356.0" y="285.0" text-anchor="middle">One owner</text></g>
    <g class="in" style="animation-delay:1.4s"><rect x="440" y="256" width="204" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="542.0" y="285.0" text-anchor="middle">Faster delivery</text></g>
  </g>
</svg>
