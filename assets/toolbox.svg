<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="256" viewBox="0 0 1280 256" role="img" aria-label="Toolbox: Next.js, React, TypeScript, Tailwind CSS, Node.js, Express, Firebase, Supabase, REST APIs, Kotlin, Jetpack Compose, Swift, Flutter, React Native.">
  <defs>
