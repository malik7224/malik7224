<text class="dim in" x="36" y="304" font-size="18" font-weight="400" style="animation-delay:1.0s" >and the app in your customers' hands.</text>
<text class="m dim in" x="36" y="346" font-size="14" font-weight="500" style="animation-delay:1.1s" >COO at Preesoft  ·  Top Rated Plus on Upwork</text>
<g class="in" style="animation-delay:.4s"><rect x="36" y="376" width="568" height="318" rx="14" fill="#141416" stroke="#3A3A3F"/><line x1="36" y1="416" x2="604" y2="416" stroke="#2B2B2F"/><circle cx="56" cy="396" r="4.5" fill="#3A3A3F"/><circle cx="74" cy="396" r="4.5" fill="#3A3A3F"/><circle cx="92" cy="396" r="4.5" fill="#3A3A3F"/><text class="m dim" x="116" y="401" font-size="13" font-weight="400" >malik.ts</text></g>
<text xml:space="preserve" class="m in" style="animation-delay:0.7s" x="56" y="456" font-size="16"><tspan fill="#C9A8FF">const</tspan><tspan> malik = {</tspan></text>
<text xml:space="preserve" class="m in" style="animation-delay:0.8799999999999999s" x="56" y="485" font-size="16"><tspan>  role: </tspan><tspan fill="#9FD8AE">"Full-stack engineer"</tspan><tspan>,</tspan></text>
<text xml:space="preserve" class="m in" style="animation-delay:1.06s" x="56" y="514" font-size="16"><tspan>  web: [</tspan><tspan fill="#9FD8AE">"Next.js"</tspan><tspan>, </tspan><tspan fill="#9FD8AE">"React"</tspan><tspan>, </tspan><tspan fill="#9FD8AE">"TS"</tspan><tspan>],</tspan></text>
<text xml:space="preserve" class="m in" style="animation-delay:1.24s" x="56" y="543" font-size="16"><tspan>  api: [</tspan><tspan fill="#9FD8AE">"Node.js"</tspan><tspan>, </tspan><tspan fill="#9FD8AE">"Firebase"</tspan><tspan>],</tspan></text>
<text xml:space="preserve" class="m in" style="animation-delay:1.42s" x="56" y="572" font-size="16"><tspan>  mobile: [</tspan><tspan fill="#9FD8AE">"Kotlin"</tspan><tspan>, </tspan><tspan fill="#9FD8AE">"Flutter"</tspan><tspan>, </tspan><tspan fill="#9FD8AE">"Swift"</tspan><tspan>],</tspan></text>
<text xml:space="preserve" class="m in" style="animation-delay:1.5999999999999999s" x="56" y="601" font-size="16"><tspan>  company: </tspan><tspan fill="#9FD8AE">"Preesoft"</tspan><tspan>,</tspan></text>
<text xml:space="preserve" class="m in" style="animation-delay:1.78s" x="56" y="630" font-size="16"><tspan>  available: </tspan><tspan fill="#F2B84B">true</tspan><tspan>,</tspan></text>
<text xml:space="preserve" class="m in" style="animation-delay:1.96s" x="56" y="659" font-size="16"><tspan>};</tspan></text>
