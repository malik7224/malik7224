<text class="in" x="34" y="140" font-size="54" font-weight="700" style="animation-delay:0.3s" letter-spacing="-2">Web. API. Mobile.</text>
<text class="acc in" x="34" y="200" font-size="54" font-weight="700" style="animation-delay:0.5s" letter-spacing="-2">One engineer.</text>
