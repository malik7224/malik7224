<svg xmlns="http://www.w3.org/2000/svg" width="640" height="238" viewBox="0 0 640 238" role="img" aria-label="7+ years shipping software. Web, API and mobile with one owner. Clients in the US and UK through Preesoft. Top 3% Top Rated Plus on Upwork.">
  <defs>
