<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="What I deliver. Web: Next.js, React, TypeScript. Backend: Node.js, TypeScript, Firebase. Mobile: Kotlin, Jetpack Compose, React Native.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#26262B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A853"/><stop offset="1" stop-color="#F1D79A"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 700; fill: #D4A853; letter-spacing: 5px; }
    .h1   { font-size: 44px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.8px; }
    .p    { font-size: 24px; fill: #A1A1AA; }
    .note { font-size: 19px; fill: #8A8A93; }
    .ct   { font-size: 28px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.3px; }
    .cs   { font-size: 18px; fill: #D4A853; font-weight: 600; letter-spacing: .3px; }
    .li   { font-size: 20px; fill: #C4C4CB; }
    .chip { font-size: 19px; font-weight: 600; fill: #F4F4F5; }
    .lab  { font-size: 14px; font-weight: 700; fill: #D4A853; letter-spacing: 3px; }
    .in   { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <clipPath id="clip"><rect width="1280" height="440" rx="12"/></clipPath>
  <g clip-path="url(#clip)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="1279" height="439" rx="12" fill="none" stroke="#3F3F46"/>
    <text class="eyebrow in" x="80" y="78" style="animation-delay:0.1s">WHAT I DELIVER</text>
    <g class="in" style="animation-delay:0.3s"><rect x="80" y="112" width="346" height="300" rx="10" fill="#202024" stroke="#3F3F46"/><rect x="80" y="140" width="3" height="52" rx="1.5" fill="url(#gold)"/></g>
    <text class="lab in" x="108" y="160" style="animation-delay:0.3s">01</text>
    <text class="ct in" x="108" y="200" style="animation-delay:0.3s">Web</text>
    <text class="cs in" x="108" y="236" style="animation-delay:0.3s">Next.js · React · TypeScript</text>
    <line x1="108" y1="262" x2="398" y2="262" stroke="#3F3F46"/>
    <circle class="in" style="animation-delay:0.5s" cx="114" cy="297" r="3" fill="#D4A853"/>
    <text class="li in" x="130" y="304" style="animation-delay:0.5s">Dashboards and admin panels</text>
    <circle class="in" style="animation-delay:0.5s" cx="114" cy="333" r="3" fill="#D4A853"/>
    <text class="li in" x="130" y="340" style="animation-delay:0.5s">Storefronts and company sites</text>
    <circle class="in" style="animation-delay:0.5s" cx="114" cy="369" r="3" fill="#D4A853"/>
    <text class="li in" x="130" y="376" style="animation-delay:0.5s">Fast and accessible</text>
    <g class="in" style="animation-delay:0.6s"><rect x="467" y="112" width="346" height="300" rx="10" fill="#202024" stroke="#3F3F46"/><rect x="467" y="140" width="3" height="52" rx="1.5" fill="url(#gold)"/></g>
    <text class="lab in" x="495" y="160" style="animation-delay:0.6s">02</text>
    <text class="ct in" x="495" y="200" style="animation-delay:0.6s">Backend</text>
    <text class="cs in" x="495" y="236" style="animation-delay:0.6s">Node.js · TypeScript · Firebase</text>
    <line x1="495" y1="262" x2="785" y2="262" stroke="#3F3F46"/>
    <circle class="in" style="animation-delay:0.8s" cx="501" cy="297" r="3" fill="#D4A853"/>
    <text class="li in" x="517" y="304" style="animation-delay:0.8s">REST APIs and integrations</text>
    <circle class="in" style="animation-delay:0.8s" cx="501" cy="333" r="3" fill="#D4A853"/>
    <text class="li in" x="517" y="340" style="animation-delay:0.8s">Auth, roles, notifications</text>
    <circle class="in" style="animation-delay:0.8s" cx="501" cy="369" r="3" fill="#D4A853"/>
    <text class="li in" x="517" y="376" style="animation-delay:0.8s">Secure and documented</text>
    <g class="in" style="animation-delay:0.8999999999999999s"><rect x="854" y="112" width="346" height="300" rx="10" fill="#202024" stroke="#3F3F46"/><rect x="854" y="140" width="3" height="52" rx="1.5" fill="url(#gold)"/></g>
    <text class="lab in" x="882" y="160" style="animation-delay:0.8999999999999999s">03</text>
    <text class="ct in" x="882" y="200" style="animation-delay:0.8999999999999999s">Mobile</text>
    <text class="cs in" x="882" y="236" style="animation-delay:0.8999999999999999s">Kotlin · Compose · React Native</text>
    <line x1="882" y1="262" x2="1172" y2="262" stroke="#3F3F46"/>
    <circle class="in" style="animation-delay:1.0999999999999999s" cx="888" cy="297" r="3" fill="#D4A853"/>
    <text class="li in" x="904" y="304" style="animation-delay:1.0999999999999999s">Native Android apps</text>
    <circle class="in" style="animation-delay:1.0999999999999999s" cx="888" cy="333" r="3" fill="#D4A853"/>
    <text class="li in" x="904" y="340" style="animation-delay:1.0999999999999999s">React Native apps</text>
    <circle class="in" style="animation-delay:1.0999999999999999s" cx="888" cy="369" r="3" fill="#D4A853"/>
    <text class="li in" x="904" y="376" style="animation-delay:1.0999999999999999s">Offline-first, maps, push</text>
  </g>
</svg>
