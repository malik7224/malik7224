<svg xmlns="http://www.w3.org/2000/svg" width="640" height="366" viewBox="0 0 640 366" role="img" aria-label="How we'll work: scope, design, build, ship.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#26262A" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F4F4F2; }
    .m   { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
    .dim { fill: #A1A1A6; }
    .acc { fill: #F2B84B; }
    .in  { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<rect x="0.5" y="0.5" width="639" height="365" rx="18" fill="#1E1E21" stroke="#333338"/>
<text class="" x="28" y="60" font-size="30" font-weight="600" letter-spacing="-.8">How we'll work</text>
<g class="in" style="animation-delay:0.2s"><line x1="28" y1="100" x2="310" y2="100" stroke="#3A3A3F"/><circle cx="33" cy="100" r="5" fill="#F2B84B"/><text class="m dim" x="28" y="132" font-size="12" font-weight="400" letter-spacing="1.4">STEP 01</text><text class="" x="28" y="160" font-size="21" font-weight="600" >Scope</text><text class="dim" x="28" y="186" font-size="15" font-weight="400" >Plan, timeline and price</text><text class="dim" x="28" y="207" font-size="15" font-weight="400" >before any code.</text></g>
<g class="in" style="animation-delay:0.45s"><line x1="330" y1="100" x2="612" y2="100" stroke="#3A3A3F"/><circle cx="335" cy="100" r="5" fill="#F4F4F2"/><text class="m dim" x="330" y="132" font-size="12" font-weight="400" letter-spacing="1.4">STEP 02</text><text class="" x="330" y="160" font-size="21" font-weight="600" >Design</text><text class="dim" x="330" y="186" font-size="15" font-weight="400" >Screens and data model</text><text class="dim" x="330" y="207" font-size="15" font-weight="400" >agreed up front.</text></g>
<g class="in" style="animation-delay:0.7s"><line x1="28" y1="228" x2="310" y2="228" stroke="#3A3A3F"/><circle cx="33" cy="228" r="5" fill="#F4F4F2"/><text class="m dim" x="28" y="260" font-size="12" font-weight="400" letter-spacing="1.4">STEP 03</text><text class="" x="28" y="288" font-size="21" font-weight="600" >Build</text><text class="dim" x="28" y="314" font-size="15" font-weight="400" >Regular demos you</text><text class="dim" x="28" y="335" font-size="15" font-weight="400" >can click.</text></g>
<g class="in" style="animation-delay:0.95s"><line x1="330" y1="228" x2="612" y2="228" stroke="#3A3A3F"/><circle cx="335" cy="228" r="5" fill="#F4F4F2"/><text class="m dim" x="330" y="260" font-size="12" font-weight="400" letter-spacing="1.4">STEP 04</text><text class="" x="330" y="288" font-size="21" font-weight="600" >Ship</text><text class="dim" x="330" y="314" font-size="15" font-weight="400" >Store release, deployment,</text><text class="dim" x="330" y="335" font-size="15" font-weight="400" >handover docs.</text></g>
</svg>
