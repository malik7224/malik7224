<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="How we'll work: scope, design, build, ship.">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#26262A" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F4F4F2; }
    .m   { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
    .dim { fill: #A1A1A6; }
    .acc { fill: #F2B84B; }
    .in  { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<rect x="0.5" y="0.5" width="1279" height="299" rx="24" fill="#1E1E21" stroke="#333338"/>
<text class="" x="48" y="84" font-size="38" font-weight="600" letter-spacing="-1">How we'll work</text>
<line x1="48" y1="150" x2="1232" y2="150" stroke="#3A3A3F"/>
<g class="in" style="animation-delay:0.2s"><circle cx="53" cy="150" r="6" fill="#F2B84B"/><text class="m dim" x="48" y="194" font-size="13" font-weight="400" letter-spacing="1.4">STEP 01</text><text class="" x="48" y="226" font-size="22" font-weight="600" >Scope</text><text class="dim" x="48" y="256" font-size="15" font-weight="400" >Plan, timeline and price</text><text class="dim" x="48" y="278" font-size="15" font-weight="400" >before any code.</text></g>
<g class="in" style="animation-delay:0.45s"><circle cx="349" cy="150" r="6" fill="#F4F4F2"/><text class="m dim" x="344" y="194" font-size="13" font-weight="400" letter-spacing="1.4">STEP 02</text><text class="" x="344" y="226" font-size="22" font-weight="600" >Design</text><text class="dim" x="344" y="256" font-size="15" font-weight="400" >Screens and data model</text><text class="dim" x="344" y="278" font-size="15" font-weight="400" >agreed up front.</text></g>
<g class="in" style="animation-delay:0.7s"><circle cx="645" cy="150" r="6" fill="#F4F4F2"/><text class="m dim" x="640" y="194" font-size="13" font-weight="400" letter-spacing="1.4">STEP 03</text><text class="" x="640" y="226" font-size="22" font-weight="600" >Build</text><text class="dim" x="640" y="256" font-size="15" font-weight="400" >Regular demos you</text><text class="dim" x="640" y="278" font-size="15" font-weight="400" >can click.</text></g>
<g class="in" style="animation-delay:0.95s"><circle cx="941" cy="150" r="6" fill="#F4F4F2"/><text class="m dim" x="936" y="194" font-size="13" font-weight="400" letter-spacing="1.4">STEP 04</text><text class="" x="936" y="226" font-size="22" font-weight="600" >Ship</text><text class="dim" x="936" y="256" font-size="15" font-weight="400" >Store release, deployment,</text><text class="dim" x="936" y="278" font-size="15" font-weight="400" >handover docs.</text></g>
</svg>
