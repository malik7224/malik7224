<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Web: Next.js, React, TypeScript. Backend: Node.js, Express, Firebase, Supabase. Mobile: Kotlin, Compose, Flutter, Swift.">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#26262A" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F4F4F2; }
    .m   { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
    .dim { fill: #A1A1A6; }
    .acc { fill: #F2B84B; }
    .in  { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<g class="in" style="animation-delay:0.1s"><rect x="0.5" y="0.5" width="415" height="299" rx="20" fill="#232326" stroke="#333338"/><text class="" x="28" y="86" font-size="60" font-weight="700" fill="#3A3A3F" letter-spacing="-2">01</text><text class="" x="28" y="138" font-size="28" font-weight="600" >Web</text><text class="dim" x="28" y="178" font-size="16" font-weight="400" >Dashboards, admin panels, storefronts</text><text class="dim" x="28" y="204" font-size="16" font-weight="400" >and company sites. Fast and accessible.</text><text class="m acc" x="28" y="258" font-size="14" font-weight="400" >Next.js · React · TypeScript</text></g>
<g class="in" style="animation-delay:0.30000000000000004s"><rect x="432.5" y="0.5" width="415" height="299" rx="20" fill="#232326" stroke="#333338"/><text class="" x="460" y="86" font-size="60" font-weight="700" fill="#3A3A3F" letter-spacing="-2">02</text><text class="" x="460" y="138" font-size="28" font-weight="600" >Backend</text><text class="dim" x="460" y="178" font-size="16" font-weight="400" >REST APIs, integrations, auth, roles</text><text class="dim" x="460" y="204" font-size="16" font-weight="400" >and notifications. Secure and documented.</text><text class="m acc" x="460" y="258" font-size="14" font-weight="400" >Node.js · Express · Firebase · Supabase</text></g>
<g class="in" style="animation-delay:0.5s"><rect x="864.5" y="0.5" width="415" height="299" rx="20" fill="#232326" stroke="#333338"/><text class="" x="892" y="86" font-size="60" font-weight="700" fill="#3A3A3F" letter-spacing="-2">03</text><text class="" x="892" y="138" font-size="28" font-weight="600" >Mobile</text><text class="dim" x="892" y="178" font-size="16" font-weight="400" >Native Android and iPhone, React Native</text><text class="dim" x="892" y="204" font-size="16" font-weight="400" >and Flutter apps. Offline-first, maps, push.</text><text class="m acc" x="892" y="258" font-size="14" font-weight="400" >Kotlin · Compose · Flutter · Swift</text></g>
</svg>
