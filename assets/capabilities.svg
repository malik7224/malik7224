<svg xmlns="http://www.w3.org/2000/svg" width="640" height="454" viewBox="0 0 640 454" role="img" aria-label="Web: Next.js, React, TypeScript. Backend: Node.js, Express, Firebase, Supabase. Mobile: Kotlin, Compose, Flutter, Swift.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#26262A" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F4F4F2; }
    .m   { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
    .dim { fill: #A1A1A6; }
    .acc { fill: #F2B84B; }
    .in  { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<g class="in" style="animation-delay:0.1s"><rect x="0.5" y="0.5" width="639" height="141" rx="16" fill="#232326" stroke="#333338"/><text class="" x="26" y="78" font-size="44" font-weight="700" fill="#3A3A3F" letter-spacing="-1.5">01</text><text class="" x="100" y="44" font-size="24" font-weight="600" >Web</text><text class="dim" x="100" y="74" font-size="16" font-weight="400" >Dashboards, admin panels, storefronts</text><text class="dim" x="100" y="97" font-size="16" font-weight="400" >and company sites. Fast and accessible.</text><text class="m acc" x="100" y="124" font-size="13" font-weight="400" >Next.js · React · TypeScript</text></g>
<g class="in" style="animation-delay:0.30000000000000004s"><rect x="0.5" y="156.5" width="639" height="141" rx="16" fill="#232326" stroke="#333338"/><text class="" x="26" y="234" font-size="44" font-weight="700" fill="#3A3A3F" letter-spacing="-1.5">02</text><text class="" x="100" y="200" font-size="24" font-weight="600" >Backend</text><text class="dim" x="100" y="230" font-size="16" font-weight="400" >REST APIs, integrations, auth, roles</text><text class="dim" x="100" y="253" font-size="16" font-weight="400" >and notifications. Secure and documented.</text><text class="m acc" x="100" y="280" font-size="13" font-weight="400" >Node.js · Express · Firebase · Supabase</text></g>
<g class="in" style="animation-delay:0.5s"><rect x="0.5" y="312.5" width="639" height="141" rx="16" fill="#232326" stroke="#333338"/><text class="" x="26" y="390" font-size="44" font-weight="700" fill="#3A3A3F" letter-spacing="-1.5">03</text><text class="" x="100" y="356" font-size="24" font-weight="600" >Mobile</text><text class="dim" x="100" y="386" font-size="16" font-weight="400" >Native Android, React Native and Flutter</text><text class="dim" x="100" y="409" font-size="16" font-weight="400" >apps. Offline-first, maps and push.</text><text class="m acc" x="100" y="436" font-size="13" font-weight="400" >Kotlin · Compose · Flutter · Swift</text></g>
