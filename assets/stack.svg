<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="406" viewBox="0 0 1280 406" role="img" aria-label="Tech stack. Web: Next.js, React, TypeScript, Tailwind CSS. Backend: Node.js, Express, Firebase, REST APIs. Mobile: Kotlin, Jetpack Compose, React Native. Tools: Git, Vercel, Android Studio.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18181B"/><stop offset="1" stop-color="#26262B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D4A853"/><stop offset="1" stop-color="#F1D79A"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 700; fill: #D4A853; letter-spacing: 5px; }
    .h1   { font-size: 44px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.8px; }
    .p    { font-size: 24px; fill: #A1A1AA; }
    .note { font-size: 19px; fill: #8A8A93; }
    .ct   { font-size: 28px; font-weight: 700; fill: #F4F4F5; letter-spacing: -.3px; }
    .cs   { font-size: 18px; fill: #D4A853; font-weight: 600; letter-spacing: .3px; }
    .li   { font-size: 20px; fill: #C4C4CB; }
    .chip { font-size: 19px; font-weight: 600; fill: #F4F4F5; }
    .lab  { font-size: 14px; font-weight: 700; fill: #D4A853; letter-spacing: 3px; }
    .in   { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <clipPath id="clip"><rect width="1280" height="406" rx="12"/></clipPath>
  <g clip-path="url(#clip)">
    <rect width="1280" height="406" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="1279" height="405" rx="12" fill="none" stroke="#3F3F46"/>
    <text class="eyebrow in" x="80" y="78" style="animation-delay:0.1s">TECH STACK</text>
    <text class="lab in" x="80" y="141" style="animation-delay:0.2s">WEB</text>
    <g class="in" style="animation-delay:0.3s"><rect x="250" y="112" width="114" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="307.0" y="141.0" text-anchor="middle">Next.js</text></g>
    <g class="in" style="animation-delay:0.38s"><rect x="378" y="112" width="92" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="424.0" y="141.0" text-anchor="middle">React</text></g>
    <g class="in" style="animation-delay:0.45999999999999996s"><rect x="484" y="112" width="148" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="558.0" y="141.0" text-anchor="middle">TypeScript</text></g>
    <g class="in" style="animation-delay:0.54s"><rect x="646" y="112" width="170" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="731.0" y="141.0" text-anchor="middle">Tailwind CSS</text></g>
    <text class="lab in" x="80" y="211" style="animation-delay:0.4s">BACKEND</text>
    <g class="in" style="animation-delay:0.5s"><rect x="250" y="182" width="114" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="307.0" y="211.0" text-anchor="middle">Node.js</text></g>
    <g class="in" style="animation-delay:0.58s"><rect x="378" y="182" width="114" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="435.0" y="211.0" text-anchor="middle">Express</text></g>
    <g class="in" style="animation-delay:0.66s"><rect x="506" y="182" width="125" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="568.5" y="211.0" text-anchor="middle">Firebase</text></g>
    <g class="in" style="animation-delay:0.74s"><rect x="645" y="182" width="136" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="713.0" y="211.0" text-anchor="middle">REST APIs</text></g>
    <text class="lab in" x="80" y="281" style="animation-delay:0.6000000000000001s">MOBILE</text>
    <g class="in" style="animation-delay:0.7s"><rect x="250" y="252" width="103" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="301.5" y="281.0" text-anchor="middle">Kotlin</text></g>
    <g class="in" style="animation-delay:0.7799999999999999s"><rect x="367" y="252" width="204" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="469.0" y="281.0" text-anchor="middle">Jetpack Compose</text></g>
    <g class="in" style="animation-delay:0.86s"><rect x="585" y="252" width="170" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="670.0" y="281.0" text-anchor="middle">React Native</text></g>
    <text class="lab in" x="80" y="351" style="animation-delay:0.8s">TOOLS</text>
    <g class="in" style="animation-delay:0.9000000000000001s"><rect x="250" y="322" width="69" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="284.5" y="351.0" text-anchor="middle">Git</text></g>
    <g class="in" style="animation-delay:0.9800000000000001s"><rect x="333" y="322" width="103" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="384.5" y="351.0" text-anchor="middle">Vercel</text></g>
    <g class="in" style="animation-delay:1.06s"><rect x="450" y="322" width="192" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#52525B"/><text class="chip" x="546.0" y="351.0" text-anchor="middle">Android Studio</text></g>
  </g>
</svg>
