<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Have an idea? Let's ship it.">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#26262A" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F4F4F2; }
    .m   { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
    .dim { fill: #A1A1A6; }
    .acc { fill: #F2B84B; }
    .in  { animation: in .7s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<rect x="0.5" y="0.5" width="1279" height="249" rx="24" fill="#1E1E21" stroke="#333338"/><rect x="0" y="0" width="1280" height="250" rx="24" fill="url(#grid)"/>
<text class="in" x="64" y="120" font-size="64" font-weight="700" style="animation-delay:0.2s" letter-spacing="-2.4">Have an idea?</text>
<text class="acc in" x="64" y="196" font-size="64" font-weight="700" style="animation-delay:0.4s" letter-spacing="-2.4">Let's ship it.</text>
</svg>
