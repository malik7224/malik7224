<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Malik Ali, Full-Stack Engineer. Web: Next.js, React, TypeScript. Backend: Node.js, APIs, Firebase. Mobile: Kotlin, Jetpack Compose, React Native.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#26262B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A853"/>
      <stop offset="1" stop-color="#F1D79A"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="300" rx="12"/></clipPath>
  </defs>

  <style>
    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 600; fill: #D4A853; letter-spacing: 5px; }
    .title { font-size: 56px; font-weight: 700; fill: #F4F4F5; letter-spacing: -1.2px; }
    .sub   { font-size: 24px; fill: #A1A1AA; }
    .cred  { font-size: 17px; fill: #8A8A93; letter-spacing: .3px; }
    .pill  { font-size: 15px; font-weight: 600; fill: #4ADE80; letter-spacing: .3px; }
    .lab   { font-size: 13px; font-weight: 700; fill: #D4A853; letter-spacing: 3px; }
    .tech  { font-size: 22px; font-weight: 500; fill: #F4F4F5; }
    .in    { animation: in .7s ease-out backwards; }
    .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}
    .d5{animation-delay:1.4s}.d6{animation-delay:1.7s}.d7{animation-delay:2.0s}
    .dot   { animation: pulse 2s ease-in-out infinite; transform-origin: 98px 66px; }
    .bar   { transform-box: fill-box; transform-origin: top; animation: grow .6s ease-out backwards; }
    .b1{animation-delay:1.0s}.b2{animation-delay:1.4s}.b3{animation-delay:1.8s}
    @keyframes in    { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes grow  { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.5); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="1279" height="299" rx="12" fill="none" stroke="#3F3F46"/>

    <!-- status pill -->
    <g class="in d1">
      <rect x="80" y="40" width="252" height="40" rx="20" fill="#4ADE80" fill-opacity="0.08" stroke="#4ADE80" stroke-opacity="0.35"/>
      <circle class="dot" cx="98" cy="60" r="4.5" fill="#4ADE80"/>
      <text class="sans pill" x="114" y="65">Available for new projects</text>
    </g>

    <!-- identity -->
    <text class="sans eyebrow in d2" x="82" y="128">MALIK ALI</text>
    <text class="sans title in d3" x="80" y="190">Full-Stack Engineer</text>
    <text class="sans sub in d4" x="82" y="228">Web, backend and mobile, built end to end.</text>
    <text class="sans cred in d5" x="82" y="266">COO at Preesoft  ·  Top Rated Plus on Upwork</text>

    <!-- stack panel -->
    <rect x="740" y="32" width="470" height="236" rx="10" fill="#202024" stroke="#3F3F46"/>

    <line x1="764" y1="110" x2="1186" y2="110" stroke="#3F3F46"/>
    <line x1="764" y1="190" x2="1186" y2="190" stroke="#3F3F46"/>

    <g class="in d5">
      <rect class="bar b1" x="764" y="50" width="3" height="46" rx="1.5" fill="url(#gold)"/>
      <text class="sans lab" x="784" y="68">WEB</text>
      <text class="sans tech" x="784" y="95">Next.js · React · TypeScript</text>
    </g>
    <g class="in d6">
      <rect class="bar b2" x="764" y="128" width="3" height="46" rx="1.5" fill="url(#gold)"/>
      <text class="sans lab" x="784" y="146">BACKEND</text>
      <text class="sans tech" x="784" y="173">Node.js · APIs · Firebase</text>
    </g>
    <g class="in d7">
      <rect class="bar b3" x="764" y="206" width="3" height="46" rx="1.5" fill="url(#gold)"/>
      <text class="sans lab" x="784" y="224">MOBILE</text>
      <text class="sans tech" x="784" y="251">Kotlin · Compose · React Native</text>
    </g>
  </g>
</svg>
